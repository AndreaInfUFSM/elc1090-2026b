<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backend mínimo - tarefas</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <p class="eyebrow">ELC1090 · backend mínimo</p>
    <h1>Lista de tarefas</h1>
    <p class="intro">
      O frontend é o mesmo. Troque o backend e observe que o contrato HTTP continua igual.
    </p>

    <form id="task-form">
      <label for="title">Nova tarefa</label>
      <div class="row">
        <input id="title" name="title" required placeholder="Ex.: revisar autenticação">
        <button>Adicionar</button>
      </div>
    </form>

    <section>
      <div class="section-heading">
        <h2>Tarefas</h2>
        <button id="reload" class="secondary" type="button">Recarregar</button>
      </div>
      <ul id="tasks"></ul>
      <p id="status" aria-live="polite"></p>
    </section>

    <details>
      <summary>Contrato usado pelo frontend</summary>
      <pre>GET    /api/tasks
POST   /api/tasks
DELETE /api/tasks/:id</pre>
    </details>
  </main>
  <script src="/app.js"></script>
</body>
</html>
